name: Build Audiq Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/audiq-twa/**"
      - ".github/workflows/audiq-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Audiq
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare Audiq app icons
        shell: bash
        run: |
          set -euo pipefail
          icon="$RUNNER_TEMP/audiq-icon.png"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/krishnashakya569-stack/audiq/feat/audiq-android-portal/apps/web/public/brand/audiq-icon-512.png" \
            --output "$icon"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/audiq-twa/app/src/main/res/mipmap-$density"
            mkdir -p "android/audiq-twa/app/src/main/res/drawable-$density"
            cp "$icon" "android/audiq-twa/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "$icon" "android/audiq-twa/app/src/main/res/mipmap-$density/ic_maskable.png"
            cp "$icon" "android/audiq-twa/app/src/main/res/drawable-$density/splash.png"
            cp "$icon" "android/audiq-twa/app/src/main/res/drawable-$density/ic_notification_icon.png"
          done

      - name: Build release APK
        run: gradle -p android/audiq-twa :app:assembleRelease --no-daemon --max-workers=2

      - name: Save unsigned APK for local signing
        uses: actions/upload-artifact@v4
        with:
          name: audiq-unsigned-apk
          path: android/audiq-twa/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3
